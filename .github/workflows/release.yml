name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validar mensajes de commit
        run: |
          FROM="${{ github.event.before }}"
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            FROM="$(git rev-list --max-parents=0 HEAD)"
          fi
          bunx commitlint --from "$FROM" --to "${{ github.sha }}" --verbose

  bump:
    name: Calcular y aplicar versión
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular siguiente versión
        id: version
        run: |
          OUT=$(node .github/scripts/bump-version.mjs)
          echo "$OUT"
          NEXT=$(printf '%s\n' "$OUT" | sed -n 's/^next=//p')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Comprobar si la versión ya está publicada
        id: exists
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.next }}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar bump, commit y tag
        if: steps.exists.outputs.skip == 'false'
        run: |
          node .github/scripts/bump-version.mjs --apply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json electrobun.config.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de versión (primer release o sin bump): solo se crea el tag."
          else
            git commit -m "chore(release): v${{ steps.version.outputs.next }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
          git tag "v${{ steps.version.outputs.next }}"
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Disparar build y publicar
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.next }}"
          echo "Disparando release-build.yml sobre $TAG"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-build.yml/dispatches" \
            -d "{\"ref\":\"refs/tags/$TAG\"}"

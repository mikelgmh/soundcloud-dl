<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="connecting.title">Conectando</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0e;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 18px;
        border: 3px solid rgba(255, 85, 0, 0.25);
        border-top-color: #ff5500;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin-top: 6px;
        font-size: 13px;
        color: #9696a2;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <h1 id="connect-title" data-i18n="connecting.title">Conectando con la app...</h1>
      <p id="connect-subtitle" data-i18n="connecting.subtitle">Verificando tu sesión de SoundCloud</p>
    </div>
    <script>
      const DICTS = {
        es: {
          "connecting.title": "Conectando con la app...",
          "connecting.subtitle": "Verificando tu sesión de SoundCloud",
        },
        en: {
          "connecting.title": "Connecting to the app...",
          "connecting.subtitle": "Verifying your SoundCloud session",
        },
      };
      const sysLang = (navigator.language || "en").split("-")[0].toLowerCase();
      const lang = DICTS[sysLang] ? sysLang : "en";
      for (const el of document.querySelectorAll("[data-i18n]")) {
        el.textContent = DICTS[lang][el.dataset.i18n] || el.textContent;
      }
    </script>
  </body>
</html>
